<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password – CVBoost</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --brand:#FFD200; --brand-600:#F5C400; --ink:#111; --muted:#6b6b6b; --border:#e5e5e5; --green:#16a34a; --red:#dc2626; --radius:8px; --radius-sm:6px; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#2b2b2b; background:#f7f7f7; min-height:100vh; }
    .nav { background:#fff; border-bottom:2px solid var(--ink); }
    .nav-inner { max-width:1120px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; justify-content:space-between; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:900; color:var(--ink); text-decoration:none; text-transform:uppercase; font-size:1.1rem; }
    .brand .dot { width:30px; height:30px; border-radius:6px; display:grid; place-items:center; background:var(--brand); }
    .nav a.back { color:var(--ink); text-decoration:none; font-weight:600; font-size:.9rem; }
    .wrap { display:flex; align-items:center; justify-content:center; padding:48px 20px; }
    .card { background:#fff; border:2px solid var(--ink); border-radius:var(--radius); box-shadow:10px 10px 0 var(--brand); max-width:420px; width:100%; padding:36px 32px; }
    h1 { color:var(--ink); font-weight:900; text-transform:uppercase; font-size:1.7rem; margin-bottom:8px; }
    .sub { color:var(--muted); font-size:.95rem; margin-bottom:26px; }
    label { display:block; font-weight:700; font-size:.85rem; color:var(--ink); margin-bottom:6px; margin-top:16px; }
    input { width:100%; font-family:inherit; font-size:.95rem; padding:12px 14px; border:2px solid var(--border); border-radius:var(--radius-sm); }
    input:focus { outline:none; border-color:var(--ink); }
    .hint { font-size:.8rem; color:var(--muted); margin-top:6px; }
    .btn { width:100%; margin-top:22px; font-family:inherit; font-weight:700; font-size:1rem; padding:14px; border:none; border-radius:var(--radius-sm); background:var(--brand); color:#111; cursor:pointer; transition:background .15s; }
    .btn:hover:not(:disabled) { background:var(--brand-600); }
    .btn:disabled { opacity:.55; cursor:not-allowed; }
    .msg { margin-top:16px; padding:12px 14px; border-radius:var(--radius-sm); font-size:.9rem; font-weight:600; display:none; }
    .msg.error { background:#fee2e2; color:var(--red); border:2px solid var(--red); display:block; }
    .msg.success { background:#dcfce7; color:var(--green); border:2px solid var(--green); display:block; }
    .alt { text-align:center; margin-top:20px; font-size:.9rem; color:var(--muted); }
    .alt a { color:var(--ink); font-weight:700; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/index.html" class="brand"><span class="dot">🚀</span> CVBoost</a>
      <a href="/index.html" class="back">← Home</a>
    </div>
  </nav>
  <div class="wrap">
    <div class="card">
      <h1>New Password</h1>
      <p class="sub">Choose a new password for your account.</p>

      <div id="form">
        <label for="password">New password</label>
        <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" placeholder="Repeat your password" autocomplete="new-password">
        <p class="hint">Minimum 8 characters.</p>
        <button class="btn" id="saveBtn">Save new password →</button>
      </div>

      <div class="msg" id="msg"></div>
      <p class="alt" id="altLink" style="display:none;"><a href="/login.html">Go to log in →</a></p>
      <p class="alt" id="askAgain" style="display:none;"><a href="/forgot-password.html">Request a new reset link</a></p>
    </div>
  </div>
  <script>
    const passEl   = document.getElementById("password");
    const confEl   = document.getElementById("confirm");
    const btn      = document.getElementById("saveBtn");
    const msg      = document.getElementById("msg");
    const formEl   = document.getElementById("form");
    const altLink  = document.getElementById("altLink");
    const askAgain = document.getElementById("askAgain");

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className   = "msg " + type;
    }

    // Read the token from the URL.
    const token = new URLSearchParams(window.location.search).get("token") || "";

    if (!token) {
      formEl.style.display   = "none";
      askAgain.style.display = "block";
      showMsg("This link is missing its reset token. Please request a new one.", "error");
    }

    btn.addEventListener("click", async () => {
      const password = passEl.value;
      const confirm  = confEl.value;
      msg.className  = "msg";

      if (!password || password.length < 8) {
        showMsg("Password must be at least 8 characters.", "error");
        return;
      }
      if (password !== confirm) {
        showMsg("The two passwords do not match.", "error");
        return;
      }

      btn.disabled    = true;
      btn.textContent = "Saving...";

      try {
        const res  = await fetch("/api/auth/reset-password", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ token, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          showMsg(data.error || "Could not reset your password.", "error");
          if (data.code === "TOKEN_INVALID") {
            formEl.style.display   = "none";
            askAgain.style.display = "block";
          } else {
            btn.disabled    = false;
            btn.textContent = "Save new password →";
          }
          return;
        }

        // Success — hide the form and point at the login page.
        formEl.style.display  = "none";
        altLink.style.display = "block";
        showMsg(data.message, "success");
        setTimeout(() => window.location.href = "/login.html?reset=true", 2500);

      } catch (e) {
        showMsg("Something went wrong. Please try again.", "error");
        btn.disabled    = false;
        btn.textContent = "Save new password →";
      }
    });

    confEl.addEventListener("keydown", (e) => { if (e.key === "Enter") btn.click(); });
  </script>
</body>
</html>
